
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Bootstrap CSS -->
  <link rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />

  <!-- Custom CSS -->
  <style>
    /* Footer background */
    footer {
      background: #263238;
      width: 100%;
    }

    /* Center text and spacing */
    footer .container {
      padding: 22px 0 !important;
    }

    /* Footer text styling */
    footer h5 {
      margin: 0;
      font-size: 14px;
      font-weight: 500;
      color: #b0bec5;
    }

    /* Highlighted link */
    footer a {
      color: #17a2b8 !important;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>

  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/996973c893.js"></script>

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@400;500;600;700;800&family=Roboto+Slab:wght@200;400;600;900&display=swap"
    rel="stylesheet" />

  <title>My Portfolio</title>
</head>

<body>
  <!-- Footer -->
  <footer>
    <div class="container text-muted text-center py-3 mt-5">
      <h5>
        Copyright &copy; 2026 |
        <a class="text-info text-decoration-none" href="#about">
          All Rights Reserved by Code Galaxy
        </a>
      </h5>
    </div>
  </footer>
</body>

</html>
