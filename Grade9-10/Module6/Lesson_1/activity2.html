
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />

  <!-- Custom CSS -->
  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      background: #202b38;
      font-family: "Baloo Tamma 2", cursive;
    }

    /* Main Heading Font */
    .m-heading {
      font-family: "Roboto Slab", serif;
    }

    .text-white {
      color: white;
    }

    /* Main Container height */
    .main-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-image: url('https://github.com/harshacc031-dot/img/blob/main/1.png?raw=true');
      background-attachment: fixed;
      background-size: cover;
    }

    /* Aligning items in main row */
    .main_row {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Changing heading font size */
    .main_row h1 {
      font-size: 4.5rem;
    }

    /* Making the main image the size of the screen */
    .main_row img {
      width: auto;
      height: 100vh;
    }
  </style>

  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/996973c893.js"></script>

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@400;500;600;700;800&family=Roboto+Slab:wght@200;400;600;900&display=swap"
    rel="stylesheet" />

  <title>My Introduction</title>
</head>

<body>
  <!-- Main Container -->
  <div class="main-container container">
    <h2 class="text-white">Welcome! I'm</h2>
    <h1 class="text-warning m-heading">Code Galaxy</h1>
    <h2 class="text-white">Learn. Create. Code.</h2>
  </div>
</body>

</html>
