<!DOCTYPE html>
<html>

<body>
    <h2>JavaScript For Loop</h2>
    <p id="demo"></p>
    <script>
        var colors = ["Red", "Orange", "Yellow", "Green", "Blue", "Indigo", "Violet"];
        var text = "";
        var i;
        for (i = 0; i < colors.length; i++) {
            text += colors[i] + "<br>";
        }
        document.getElementById("demo").innerHTML = text;
    </script>
</body>

</html>
