<html>

<body>
    <h2>JavaScript Functions</h2>
    <p>Do a calculation and then display the result.</p>
    <p id="demo"></p>
    <script>
        function sum(a, b) {
            return a + b;
        }
        function calculateAverage(a, b) {
            return sum(a, b) / 2;
        }
        let result = calculateAverage(50, 30);
        document.getElementById("demo").innerHTML = result;
    </script>
</body>

</html>
