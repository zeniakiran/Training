<!DOCTYPE html>
<html>

<head>
  <title>My Delivery Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: aliceblue;
      text-align: center;
      padding: 30px;
    }

    h1 {
      color: #ff5a43;
    }

    button {
      background: #ff5a43;
      color: white;
      padding: 10px 25px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      margin: 5px;
    }

    div {
      border: 1px solid #ff5a43;
      width: 280px;
      margin: 6px auto;
      padding: 8px 12px;
      text-align: left;
      border-radius: 6px;
    }
  </style>
</head>

<body>

  <h1>My Delivery Tracker</h1>

  <button onclick="storePurchase()">Save Order</button>
  <button onclick="trackOrder()">Start Delivery</button>

  <div>JSON Text: <span id="json-text"></span></div>
  <div>Loaded Item: <span id="loaded-item"></span></div>
  <div>Loaded Price: <span id="loaded-price"></span></div>
  <div>Status: <span id="status"></span></div>
  <div>Result: <span id="result"></span></div>

  <script>

    // Create an object containing the details of the customer's order
    let purchase = {
      item: "Pizza",
      price: 5,
      shop: "My Snack Shop"
    };

    // Convert the object into JSON text and then convert it back into an object
    function storePurchase() {
      let savedData = JSON.stringify(purchase);
      let restoredData = JSON.parse(savedData);

      document.getElementById("json-text").innerHTML = savedData;
      document.getElementById("loaded-item").innerHTML = restoredData.item;
      document.getElementById("loaded-price").innerHTML = "$" + restoredData.price;
    }

    // Creates a Promise that finishes after the given number of milliseconds
    function waitTime(milliseconds) {
      return new Promise(function (resolve) {
        setTimeout(resolve, milliseconds);
      });
    }

    // Use async/await to show each delivery stage in sequence
    async function trackOrder() {
      document.getElementById("result").innerHTML = "";

      // Display the first message immediately, then change it after one second
      document.getElementById("status").innerHTML = "Order received!";

      setTimeout(function () {
        document.getElementById("status").innerHTML = "Kitchen is preparing...";
      }, 1000);

      // Wait three seconds before moving to the next delivery stage
      await waitTime(3000);
      document.getElementById("status").innerHTML = "Out for delivery!";

      // Wait another two seconds before showing the final message
      await waitTime(2000);
      document.getElementById("result").innerHTML = "Your order has arrived!";
    }

  </script>

</body>

</html>
