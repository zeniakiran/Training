<!DOCTYPE html>
<html>
<head>
  <style>

    body {
      font-family: Arial, sans-serif;
      background: aliceblue;
      text-align: center;
      padding: 30px;
    }

    h1 {
      color: navy;
    }

    input {
      padding: 8px;
      margin: 5px;
      border: 2px solid navy;
      border-radius: 6px;
      width: 220px;
    }

    button {
      background: navy;
      color: white;
      padding: 10px 25px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }

    #timer {
      color: grey;
    }

  </style>
</head>
<body>

  <h1>Lucky Draw</h1>
  <p>Enter your name and guess a number to win!</p>

  <input type="text" id="name" placeholder="Your name" required><br>
  <p id="msg-name"></p>

  <input type="number" id="guess" placeholder="Guess a number (1 to 5)" min="1" max="5" required><br>
  <p id="msg-guess"></p>

  <button onclick="validateGuess()">Try My Luck!</button>
  <p id="result"></p>
  <p id="timer"></p>

  <script>

    var elapsedTime = 0;

    // Increase the timer every second and display the updated time
    setInterval(function() {
      elapsedTime = elapsedTime + 1;

      document.getElementById("timer").textContent =
        "You have been here for " + elapsedTime + " seconds!";
    }, 1000);


    // Check the user's name and number before playing the game
    function validateGuess() {

      var playerName = document.getElementById("name").value;
      var userGuess = document.getElementById("guess").value;
      var isValid = true;


      // Check whether the player entered a name
      if (playerName == "") {

        document.getElementById("msg-name").textContent =
          "Please enter your name!";

        document.getElementById("msg-name").style.color = "red";

        isValid = false;

      } else {

        document.getElementById("msg-name").textContent =
          "Great name!";

        document.getElementById("msg-name").style.color = "green";
      }


      // Check whether the player entered a number
      if (userGuess == "") {

        document.getElementById("msg-guess").textContent =
          "Please enter a guess!";

        document.getElementById("msg-guess").style.color = "red";

        isValid = false;

      } else {

        document.getElementById("msg-guess").textContent =
          "Guess saved!";

        document.getElementById("msg-guess").style.color = "green";
      }


      // Only start the lucky draw if both inputs are valid
      if (isValid == true) {

        var randomNumber = Math.floor(Math.random() * 5) + 1;


        // Compare the user's guess with the randomly generated number
        if (userGuess == randomNumber) {

          document.getElementById("result").textContent =
            "You win, " + playerName +
            "! The lucky number was " + randomNumber + "!";

          document.getElementById("result").style.color = "green";

        } else {

          document.getElementById("result").textContent =
            "So close, " + playerName +
            "! The lucky number was " + randomNumber +
            ". Try again!";

          document.getElementById("result").style.color = "navy";
        }
      }
    }

  </script>
</body>
</html>
