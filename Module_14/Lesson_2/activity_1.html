<!DOCTYPE html>
<html>
<head>
  <title>My Fruit Cards</title>
  <style>
    body {
      font-family: Arial;
      background: #f0f4ff;
      padding: 30px;
      text-align: center;
    }
    h1 { color: #ff5a43; }
    p { color: #555; }
    .cards {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 25px;
    }
    .card {
      background: white;
      border: 3px solid #ff5a43;
      border-radius: 12px;
      padding: 20px;
      width: 200px;
    }
    .fruit-name {
      font-size: 22px;
      font-weight: bold;
      color: #333;
    }
    .fruit-fact { color: #666; margin-top: 10px; font-size: 14px; }
    button {
      background: #ff5a43;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>My Fruit Cards</h1>
  <p>Use a JavaScript class to build fruit cards!</p>
  <button onclick="showFruits()">Show Fruits!</button>
  <div class="cards">
    <div id="card1"></div>
    <div id="card2"></div>
    <div id="card3"></div>
  </div>
  <script>
    class Fruit {
      constructor(name, fact) {
        this.name = name;
        this.fact = fact;
      }
      describe() {
        return this.name + ": " + this.fact;
      }
    }

    function showFruits() {
      let f1 = new Fruit("Apple", "Grows on trees");
      let f2 = new Fruit("Banana", "Yellow and curved");
      let f3 = new Fruit("Orange", "Citrus fruit with peel");

      document.getElementById("card1").innerHTML =
        "<div class='card'><div class='fruit-name'>" + f1.name + "</div>" +
        "<div class='fruit-fact'>" + f1.describe() + "</div></div>";

      document.getElementById("card2").innerHTML =
        "<div class='card'><div class='fruit-name'>" + f2.name + "</div>" +
        "<div class='fruit-fact'>" + f2.describe() + "</div></div>";

      document.getElementById("card3").innerHTML =
        "<div class='card'><div class='fruit-name'>" + f3.name + "</div>" +
        "<div class='fruit-fact'>" + f3.describe() + "</div></div>";
    }
  </script>
</body>
</html>
